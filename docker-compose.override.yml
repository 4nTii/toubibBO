services:

  front:
    build:
      target: dev
    container_name: toubib_backoffice_dev
    restart: "no"
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - path: .env
        required: false
      - path: .env.dev
        required: false
    environment:
      - CHOKIDAR_USEPOLLING=true
